# Configuration file for turnToPerson module

# Module name
name turnToPerson

# Module period in seconds
period 0.1

# Image parameters (adjust based on your camera resolution)
image_center_u 320.0
image_center_v 240.0

# Control parameters
angular_gain 0.1          # Proportional gain for angular velocity control
max_angular_vel 30.0      # Maximum angular velocity in deg/s
dead_zone 20.0            # Dead zone around image center in pixels
command_timeout 1.0       # Timeout for velocity commands in seconds

# Navigation server connections (default values for baseControl2)
navigation_server /navigation2D_nws_yarp
localization_server /localization2D_nws_yarp
map_server /map2D_nws_yarp

# BaseControl2 direct port connection
basecontrol_port /baseControl/input/command/data:i
