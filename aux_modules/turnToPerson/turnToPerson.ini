# Configuration file for turnToPerson module

# Module name
name turnToPerson

# Module period in seconds
period 0.1

# Image parameters (adjust based on your camera resolution)
image_center_u 320.0
image_center_v 240.0

# Control parameters
angular_gain 0.1          # Proportional gain for angular velocity control
max_angular_vel 10.0      # Maximum angular velocity in deg/s
dead_zone 40.0            # Dead zone around image center in pixels
command_timeout 1.0       # Timeout for velocity commands in seconds

# Threshold and search parameters
min_angular_threshold 1.0  # Minimum angular velocity threshold to stop rotation (deg/s)
search_angular_vel 5.0     # Angular velocity for searching when no person is detected (deg/s)

# Keypoint thresholds
score_threshold 0.5
min_keypoints_active 5

# BaseControl2 direct port connection
basecontrol_port /baseControl/input/command/data:i
